# Builds the Android debug APK on every push to the main branch (the repo's
# branch is currently `master`; `main` is listed too so a later rename keeps
# working). The APK is attached to the run as a downloadable artifact.
name: Android build

on:
  push:
    branches: [main, master]
  workflow_dispatch: # "Run workflow" button in the Actions tab

# A newer push makes an in-progress build of the same branch pointless.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Vite 8 needs Node 20.19+ / 22.12+.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # capacitor-android targets Java 21 — 17 fails with "invalid source release: 21".
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      # Copies dist/ and the plugin list into the Android project (those
      # generated files are gitignored, so a fresh checkout needs this).
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: edh-life-tracker-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
